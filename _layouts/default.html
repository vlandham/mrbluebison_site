<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mr. Blue Bison: {{ page.title }}</title>
  <meta name="description" content="A source of fun and inspiration fueled by the Vallandingham family.">
  <meta name="author" content="Jim Vallandingham">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Josefin+Slab">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="container">
    <div class="two columns sidebar">
      <div id="top">
        <a href="/"><img src="img/logo.png" alt="Mr. Blue Bison"></a>
        <h2 id="logo"><a href="/">Mr. <span class="blue">Blue</span> Bison</a></h2>
      </div>
      <nav aria-label="Project categories">
        <ul>
          <li><a id="all" href="/" {% if page.categories contains "all" %}aria-current="page"{% endif %}>all</a></li>
          {%- for cat in site.nav_categories %}
          {%- if page.layout == "item" %}
          <li><a id="{{ cat }}" href="{{ cat }}.html" {% if page.categories contains cat %}class="in-post"{% endif %}>{{ cat }}</a></li>
          {%- else %}
          <li><a id="{{ cat }}" href="{{ cat }}.html" {% if page.categories contains cat %}aria-current="page"{% endif %}>{{ cat }}</a></li>
          {%- endif %}
          {%- endfor %}
        </ul>
      </nav>
    </div>
    <div class="main thirteen offset-by-one columns">
      <main id="content">
        {{ content }}
      </main>

      <footer>
        <p><a href="/">home</a> | <a href="about.html">about</a> | <a href="contact.html">contact</a> | <a href="https://feeds.feedburner.com/MrBlueBison">subscribe</a></p>
        <p>&copy; 2011 - 2018 Jim &amp; Bethany Vallandingham</p>
      </footer>
    </div>
  </div>
</body>
</html>
