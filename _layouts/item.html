---
layout: default
---
<ul class="project-gallery">
  {% for image in page.images %}
  <li>
    <img src="img/{{ image }}" alt="{{ page.title }} - image {{ forloop.index }}" {% if forloop.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %} decoding="async">
  </li>
  {% endfor %}
</ul>
<h2 id="title">{{ page.title }}</h2>
<div id="details">
  {{ content }}
</div>
